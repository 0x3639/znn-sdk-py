[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "znn-sdk"
dynamic = ["version"]
description = "Python SDK for interacting with the Zenon network and ecosystem."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "0x3639", email = "0x3639@protonmail.com" },
]
keywords = ["zenon", "znn", "network-of-momentum", "blockchain", "sdk"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "bech32>=1.2,<2",
    "bip-utils>=2.3,<3",
    "pynacl>=1.5,<2",
    "eth-abi>=5.1,<6",
    "eth-utils>=5,<6",
    "mnemonic>=0.20,<1",
    "websockets>=10,<11",
    "argon2-cffi>=23.1,<26",
    "pycryptodome>=3.20.0,<4",
]

[project.optional-dependencies]
dev = [
    "coverage==6.4",
    "ipython==8.3.0",
    "pre-commit==2.19.0",
    "pytest==7.1.2",
    "pytest-mock==3.7.0",
    "ruff==0.9.10",
]

[project.urls]
Homepage = "https://github.com/0x3639/znn-sdk-py"
Documentation = "https://pyznn.0x3639.com/"
Repository = "https://github.com/0x3639/znn-sdk-py"
Issues = "https://github.com/0x3639/znn-sdk-py/issues"

[tool.setuptools.dynamic]
version = { attr = "znn.__version__" }

[tool.setuptools.packages.find]
include = ["znn*"]
