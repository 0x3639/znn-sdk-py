name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 0x3639/zenon-sdk-spec
          path: spec-kit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q znn tests
      - run: ruff check --select E9,F63,F7,F82 znn tests
      - run: python -m pytest -q
        env:
          ZNN_SPEC_ROOT: ${{ github.workspace }}/spec-kit
      - run: python -m znn.conformance spec-kit/conformance/vectors --output znn-sdk-results.json
      - run: python spec-kit/tools/znn_spec.py check-results znn-sdk-results.json
