name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: 0x3639/zenon-sdk-spec
          ref: 69f2ecf955bafa4037c73f4b858619ef834e738b
          path: spec-kit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q znn tests
      - run: ruff check --select E9,F63,F7,F82 znn tests
      - run: python -m coverage run -m pytest -q
        env:
          ZNN_SPEC_ROOT: ${{ github.workspace }}/spec-kit
      - run: python -m coverage report
      - run: python -m znn.conformance spec-kit/conformance/vectors --output znn-sdk-results.json
      - run: python spec-kit/tools/znn_spec.py check-results znn-sdk-results.json
      - run: python spec-kit/tools/znn_spec.py check-manifest conformance/manifest.json
      - run: python tools/generate_documentation.py --check

  documentation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documentation/website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: documentation/website/package-lock.json
      - run: npm ci
      - run: npm run build
